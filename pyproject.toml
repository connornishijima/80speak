[project]
name = "80speak"
version = "1.0.0"
description = "DECtalk Text-to-Speech API Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
80speak = "main:app"

[tool.uv]
dev-dependencies = [
    "httpx>=0.26.0",
    "pytest>=8.0.0",
]
